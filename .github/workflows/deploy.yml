# Publica la web en GitHub Pages.
#
# Se ejecuta al guardar cualquier cambio, pero solo publica desde la rama por
# defecto del repositorio: es la única que GitHub Pages admite, y también es
# donde se guardan los cambios cuando editas un archivo desde la web de GitHub.
# Al no depender del nombre de la rama, esto sigue funcionando aunque más
# adelante cambies cuál es la principal.
name: Publicar en GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
